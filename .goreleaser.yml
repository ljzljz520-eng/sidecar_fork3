version: 2

builds:
  - main: ./cmd/sidecar
    binary: sidecar
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.Commit={{ .ShortCommit }} -X main.Dirty=false -X main.BuildDate={{ .Date }} -X main.BuildProfile=release
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Stay a draft until the release job has generated and uploaded the
# provenance attestations, SBOMs and signature bundles. A tag must never be
# publicly installable while its verification materials are missing:
# setup.sh treats a missing attestation as "legacy" and refuses it by
# default, but keeping the release drafted closes the window entirely.
release:
  draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs(\(|:)'
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge "
      - "^Resolve the .* framing in the remote-hosts and agent-control plans$"

# Note: GoReleaser does NOT publish the Homebrew formula (there is intentionally
# no `brews:` block). Formula/sidecar.rb in marcus/homebrew-tap builds from
# source (to avoid Gatekeeper warnings on macOS) and is rendered from
# packaging/homebrew/sidecar.rb.tmpl by the `update-homebrew-tap` job in
# .github/workflows/release.yml (or by `make release-tap` for local resume).
# The td and nightshift formulas are NOT touched by that job — bump them by
# hand when co-releasing.
